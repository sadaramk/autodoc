# The Marketplace requires a globally unique name, shared with every GitHub
# user and organisation — and `nunki` is taken by a user account. This is the
# listing title only: workflows call the action by repository path
# (`uses: sadaramk/nunki@vX.Y.Z`), which this does not change.
name: Nunki Architecture Docs
description: Generate or check verifiable architecture documentation from source code
branding:
  icon: book-open
  color: gray-dark

inputs:
  command:
    description: >-
      nunki subcommand to run: check (fail when the book is out of date or
      cites stale code), generate, analyze, or verify.
    default: check
  path:
    description: Repository to document.
    default: "."
  out:
    description: Book directory. Defaults to whatever nunki.toml says.
    default: ""
  args:
    description: Extra arguments, appended verbatim.
    default: ""
  version:
    description: >-
      Release to download, such as v0.5.0. Left empty, the action uses the
      version it was pinned to (`uses: …/nunki@v0.5.0`), falling back to the
      newest release when the ref is a branch or a moving major tag.
    default: ""
  comment:
    description: >-
      With `command: diff` on a pull request, post the result as a comment.
      One comment per pull request, updated in place on every push, and removed
      again if a later push makes the architecture match the base. Needs
      `permissions: pull-requests: write`, and a checkout deep enough to hold
      the base commit (`fetch-depth: 0`).
    default: "false"
  token:
    description: >-
      Token used for the release API and download, to avoid anonymous rate
      limits, and to post the comment when `comment` is true.
    default: ${{ github.token }}

outputs:
  binary:
    description: Path to the nunki binary that ran, for further steps.
    value: ${{ steps.run.outputs.binary }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        NUNKI_VERSION: ${{ inputs.version }}
        NUNKI_COMMAND: ${{ inputs.command }}
        NUNKI_PATH: ${{ inputs.path }}
        NUNKI_OUT: ${{ inputs.out }}
        NUNKI_ARGS: ${{ inputs.args }}
        NUNKI_COMMENT: ${{ inputs.comment }}
        NUNKI_PR: ${{ github.event.pull_request.number }}
        NUNKI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-entrypoint.sh"
