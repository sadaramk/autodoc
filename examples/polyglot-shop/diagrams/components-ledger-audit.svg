<svg xmlns="http://www.w3.org/2000/svg" class="nunki ad-component" data-theme="editorial-light" data-diagram-type="ad-component" viewBox="0 0 847 712" width="847" height="712" data-width="847" data-height="712" role="img" aria-labelledby="ad-title ad-desc"><title id="ad-title">Ledger Audit — components</title><desc id="ad-desc">Component diagram with 4 nodes and 5 connections.</desc><style>.nunki[data-theme="editorial-light"]{--ad-canvas:#F8F9FA;--ad-card:#FFFFFF;--ad-card-recessed:#F4F6F8;--ad-border:#E2E8F0;--ad-text:#0F172A;--ad-muted:#64748B;--ad-edge:#A3B0C2;--ad-edge-strong:#334155;--ad-zone-fill:#F1F4F7;--ad-zone-stroke:#D5DDE7;--ad-badge:#F8FAFC;--ad-accent:#4F46E5;--ad-accent-tint:#F4F4FD;--ad-accent-soft:#C1BEF6;color-scheme:light}
