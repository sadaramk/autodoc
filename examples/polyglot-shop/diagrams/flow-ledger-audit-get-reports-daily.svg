<svg xmlns="http://www.w3.org/2000/svg" class="nunki ad-sequence" data-theme="editorial-light" data-diagram-type="ad-sequence" viewBox="0 0 720 525" width="720" height="525" data-width="720" data-height="525" role="img" aria-labelledby="ad-title ad-desc"><title id="ad-title">GET /reports/daily</title><desc id="ad-desc">Sequence diagram with 3 nodes and 3 connections.</desc><style>.nunki[data-theme="editorial-light"]{--ad-canvas:#F8F9FA;--ad-card:#FFFFFF;--ad-card-recessed:#F4F6F8;--ad-border:#E2E8F0;--ad-text:#0F172A;--ad-muted:#64748B;--ad-edge:#A3B0C2;--ad-edge-strong:#334155;--ad-zone-fill:#F1F4F7;--ad-zone-stroke:#D5DDE7;--ad-badge:#F8FAFC;--ad-accent:#4F46E5;--ad-accent-tint:#F4F4FD;--ad-accent-soft:#C1BEF6;color-scheme:light}
.nunki[data-theme="editorial-dark"]{--ad-canvas:#0B0F17;--ad-card:#151D2C;--ad-card-recessed:#111827;--ad-border:#223049;--ad-text:#F8FAFC;--ad-muted:#94A3B8;--ad-edge:#4A5B77;--ad-edge-strong:#CBD5E1;--ad-zone-fill:#0F1521;--ad-zone-stroke:#1E2A40;--ad-badge:#101826;--ad-accent:#818CF8;--ad-accent-tint:#242D49;--ad-accent-soft:#464F88;color-scheme:dark}
.nunki{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.nunki text{font-family:inherit}
