.nunki .is-primary.t-event .ad-edge-line{marker-start:url(#ad-dot-accent)}

.nunki .ad-badge{fill:var(--ad-badge);stroke:var(--ad-border);stroke-width:1}
.nunki .ad-badge-text{fill:var(--ad-muted);font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nunki .ad-evidence-glyph{fill:var(--ad-muted);opacity:.55;font:600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:end}
.nunki .ad-legend-glyph{text-anchor:start;opacity:.8}
.nunki .is-focal .ad-evidence-glyph{fill:var(--ad-accent);opacity:.8}
.nunki .ad-rule{stroke:var(--ad-border);stroke-width:1}
.nunki .ad-legend-text{fill:var(--ad-muted);font-size:12px}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:76px;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--ad-canvas);color:var(--ad-text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:focus-visible{outline:2px solid var(--ad-accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:56px;padding:0 20px;background:var(--ad-canvas);border-bottom:1px solid var(--ad-border)}
.topbar .menu{display:none}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none}
.brand-name{font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-kind{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ad-muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--ad-border);border-radius:999px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ad-muted);white-space:nowrap;text-decoration:none;background:var(--ad-card)}
a.chip:hover{color:var(--ad-text);border-color:var(--ad-edge)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ad-edge)}
.dot.ok{background:#16A34A}.dot.warn{background:#D97706}.dot.bad{background:#DC2626}.dot.none{background:var(--ad-edge)}
.topbar .spacer{flex:1}
.search{position:relative;width:min(300px,34vw)}
.search input{width:100%;height:32px;padding:0 34px 0 30px;border:1px solid var(--ad-border);border-radius:8px;background:var(--ad-card);font-size:13px}
.search input::placeholder{color:var(--ad-muted)}
.search input:focus{outline:none;border-color:var(--ad-accent)}
.search .glyph{position:absolute;left:9px;top:8px;width:15px;height:15px;stroke:var(--ad-muted);fill:none;stroke-width:1.6;pointer-events:none}
.search kbd{position:absolute;right:7px;top:6px;font:11px ui-monospace,monospace;color:var(--ad-muted);border:1px solid var(--ad-border);border-radius:4px;padding:0 5px;line-height:18px;background:var(--ad-canvas)}
.results{position:absolute;top:38px;left:0;right:0;min-width:320px;max-height:60vh;overflow:auto;background:var(--ad-card);border:1px solid var(--ad-border);border-radius:8px;padding:4px;z-index:40}
.results[hidden]{display:none}
.result{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:7px 10px;cursor:pointer}
.result[aria-selected="true"],.result:hover{background:var(--ad-canvas)}
.result .r-title{font-size:13px;font-weight:600;display:block}
.result .r-where{font-size:12px;color:var(--ad-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .empty{padding:10px;font-size:13px;color:var(--ad-muted)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--ad-border);border-radius:8px;background:var(--ad-card);cursor:pointer;color:var(--ad-muted);flex:none}
.icon-btn:hover{color:var(--ad-text);border-color:var(--ad-edge)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── Layout ─────────────────────────────────────────────────────────────── */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr) 256px;max-width:1600px;margin:0 auto}
.sidenav{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:22px 14px 40px 20px;border-right:1px solid var(--ad-border)}
.nav-group+.nav-group{margin-top:20px}
.nav-title{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ad-muted);margin:0 0 6px 8px}
.nav-list{list-style:none;margin:0;padding:0}
.nav-link{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:14px;color:var(--ad-text);line-height:1.4}
.nav-link:hover{background:var(--ad-card)}
.nav-link[aria-current="page"]{background:var(--ad-card);box-shadow:inset 2px 0 0 var(--ad-accent);font-weight:600}
.nav-hint{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ad-muted);white-space:nowrap}
.main{min-width:0;padding:34px 48px 80px}
.article{max-width:1080px;margin:0 auto}
.article>p,.article>.lead,.article>ul.list,.article>.callout{max-width:780px}
.rail{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:30px 20px 40px 8px}
.rail h2{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ad-muted);margin:0 0 8px}
.toc{list-style:none;margin:0 0 26px;padding:0;border-left:1px solid var(--ad-border)}
.toc a{display:block;padding:3px 0 3px 12px;margin-left:-1px;border-left:2px solid transparent;font-size:13px;color:var(--ad-muted);text-decoration:none;line-height:1.45}
.toc a:hover{color:var(--ad-text)}
.toc a.is-active{color:var(--ad-text);border-left-color:var(--ad-accent)}
.meta-card{border:1px solid var(--ad-border);border-radius:8px;background:var(--ad-card);padding:12px 14px;font-size:12.5px}
.meta-card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 10px}
.meta-card dt{color:var(--ad-muted)}
.meta-card dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;min-width:0}
.meta-card .links{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--ad-border);padding-top:10px}
.meta-card .links a{font:12px ui-monospace,monospace;color:var(--ad-muted);text-decoration:none;border:1px solid var(--ad-border);border-radius:5px;padding:1px 7px}
.meta-card .links a:hover{color:var(--ad-text);border-color:var(--ad-edge)}

/* ── Article ────────────────────────────────────────────────────────────── */
.eyebrow{font:500 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ad-muted);margin:0 0 8px}
.article h1{font-size:34px;line-height:1.15;font-weight:650;letter-spacing:-.02em;margin:0 0 12px}
.lead{font-size:17px;line-height:1.6;color:var(--ad-muted);margin:0 0 26px;max-width:720px}
.article h2{font-size:21px;font-weight:650;letter-spacing:-.01em;margin:40px 0 12px;padding-top:4px}
.article h3{font-size:16px;font-weight:650;margin:28px 0 8px}
.article h2 .anchor,.article h3 .anchor{margin-left:8px;color:var(--ad-muted);opacity:0;text-decoration:none;font-weight:400}
.article h2:hover .anchor,.article h3:hover .anchor,.anchor:focus{opacity:1}
.article p{margin:0 0 14px}
.article a.xref{color:var(--ad-text);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ad-accent) 55%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.article a.xref:hover{color:var(--ad-accent)}
.article strong{font-weight:620}
.article code.inline{font-size:12.5px;background:var(--ad-card);border:1px solid var(--ad-border);border-radius:4px;padding:0 5px;white-space:nowrap}
.article ul.list{margin:0 0 16px;padding-left:20px}
.article ul.list li{margin:5px 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 22px}
.stat{display:block;border:1px solid var(--ad-border);border-radius:8px;background:var(--ad-card);padding:12px 14px;text-decoration:none}
a.stat:hover{border-color:var(--ad-edge)}
.stat-value{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-label{display:block;font-size:12.5px;color:var(--ad-muted);margin-top:3px}
a.stat .stat-label::after{content:" →";opacity:.55}

.table-wrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--ad-border);border-radius:8px;background:var(--ad-card)}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.5}
table.data th{text-align:left;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ad-muted);padding:9px 12px;border-bottom:1px solid var(--ad-border);white-space:nowrap;background:var(--ad-canvas)}
table.data td{padding:8px 12px;border-top:1px solid var(--ad-border);vertical-align:top}
table.data tr:first-child td{border-top:0}
table.data td:first-child{font-weight:560}
table.data.kv th{display:none}
table.data.kv td:first-child{width:170px;color:var(--ad-muted);font-weight:400}
table.data tbody tr:hover td{background:color-mix(in srgb,var(--ad-canvas) 60%,transparent)}
table.data td.dash{color:var(--ad-muted)}
table.data a.xref,table.data strong{white-space:nowrap}
table.data td .cite{margin:2px 4px 2px 0}

.badge{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--ad-border);color:var(--ad-muted);vertical-align:1px}
.badge.observed{background:var(--ad-accent-tint);border-color:color-mix(in srgb,var(--ad-accent) 35%,transparent);color:var(--ad-accent)}
.badge.observed::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.declared{border-style:dashed}
.badge.write::before{content:"✎";font-size:11px}
.badge.read::before{content:"◌";font-size:10px}
.badge.write,.badge.read{color:var(--ad-text)}
.badge.warn{color:#B45309;border-color:#F59E0B66;background:#F59E0B14}
html[data-theme="editorial-dark"] .badge.warn{color:#FBBF24}
.badge.muted{border-color:transparent;background:var(--ad-canvas)}

.callout{border:1px solid var(--ad-border);border-left:3px solid var(--ad-edge);border-radius:8px;background:var(--ad-card);padding:12px 16px;margin:0 0 20px;font-size:14px}
.callout .c-title{font-weight:620;margin:0 0 3px}
.callout p{margin:0;color:var(--ad-muted)}
.callout.warning{border-left-color:#D97706}
.callout.note{border-left-color:var(--ad-accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0 0 20px}
.card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--ad-border);border-radius:8px;background:var(--ad-card);padding:14px 16px;text-decoration:none;min-height:118px;transition:border-color .15s ease}
.card:hover{border-color:var(--ad-accent)}
.card-title{font-weight:640;font-size:15px}
.card-text{font-size:13px;color:var(--ad-muted);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ad-muted)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;padding-top:22px;border-top:1px solid var(--ad-border)}
.pager a{display:block;border:1px solid var(--ad-border);border-radius:8px;padding:10px 14px;text-decoration:none;background:var(--ad-card)}
.pager a:hover{border-color:var(--ad-accent)}
.pager .p-dir{display:block;font-size:12px;color:var(--ad-muted)}
.pager .p-title{display:block;font-weight:600}
.pager .next{text-align:right;grid-column:2}

/* ── Citations ──────────────────────────────────────────────────────────── */
.cite{display:inline-flex;align-items:center;gap:5px;height:21px;margin:0 2px;padding:0 7px;border:1px solid var(--ad-border);border-radius:5px;background:var(--ad-card);font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ad-muted);cursor:pointer;vertical-align:1px;white-space:nowrap;max-width:260px}
.cite span.loc{overflow:hidden;text-overflow:ellipsis}
.cite:hover,.cite[aria-expanded="true"]{color:var(--ad-text);border-color:var(--ad-edge)}
.cite .dot{width:6px;height:6px;border-radius:50%;flex:none}
.popover{position:fixed;z-index:60;width:min(520px,calc(100vw - 24px));background:var(--ad-card);border:1px solid var(--ad-border);border-radius:10px;padding:0;overflow:hidden}
.popover[hidden]{display:none}
.pop-head{padding:12px 14px 10px;border-bottom:1px solid var(--ad-border)}
.pop-path{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin:0}

.walk{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:18px;align-items:start;margin:4px 0 26px}

      document.body.classList.toggle("has-fullscreen", on);
      var btn = panel.querySelector(".fs");
      btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      btn.replaceChildren(icon(on ? ICONS.close : ICONS.expand));
      if (!on) svg.style.height = "";
      layoutView();
      if (on) btn.focus();
    }
    applyVb();
    var pan = h("button", { class: "pan-hint", type: "button", title: "Fit whole diagram", onclick: function () { fit(); } }, ["Drag to pan · ", h("span", { class: "u", text: "Fit" })]);
    canvas.appendChild(pan);
    var ctl = { id: id, panel: panel, svg: svg, fit: fit, layout: layoutView, highlightEdge: highlightEdge, setFullscreen: setFullscreen, isFullscreen: function () { return panel.classList.contains("is-fullscreen"); } };
    figures.push(ctl);
    return ctl;
  }

  function cssEscape(s) { return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&"); }

  // ── Blocks ───────────────────────────────────────────────────────────────
  function renderBlock(b, ctx) {
    switch (b.t) {
      case "heading": {
        var tag = b.level <= 2 ? "h2" : "h3";
        ctx.toc.push({ id: b.id, text: b.text, level: b.level });
        return h(tag, { id: b.id }, [b.text, h("a", { class: "anchor", href: href(ctx.page.id, b.id), "aria-label": "Link to " + b.text, text: "#" })]);
      }
      case "para": return h("p", null, [inlines(b.inl)]);
      case "stats":
        return h("div", { class: "stats" }, b.items.map(function (s) {
          return h(s.page ? "a" : "div", { class: "stat", href: s.page ? href(s.page) : null }, [
            h("span", { class: "stat-value", text: s.value }), h("span", { class: "stat-label", text: s.label })
          ]);
        }));
      case "table": {
        var kv = b.columns.every(function (c) { return !c; });
        var table = h("table", { class: "data" + (kv ? " kv" : "") }, [
          h("thead", null, [h("tr", null, b.columns.map(function (c) { return h("th", { scope: "col", text: c }); }))]),
          h("tbody", null, b.rows.map(function (row) {
            return h("tr", null, row.map(function (cell) {
              var only = cell.length === 1 && cell[0].t === "text" && cell[0].v === "—";
              return h("td", { class: only ? "dash" : null }, [inlines(cell)]);
            }));
          }))
        ]);
        return h("div", { class: "table-wrap" }, [table]);
      }
      case "figure": {
        var f = mountFigure(b.diagram, { caption: b.caption });
        if (f) ctx.figureIds.push(b.diagram);
        return f ? f.panel : null;
      }
      case "callout":
        return h("aside", { class: "callout " + b.tone, role: b.tone === "warning" ? "note" : null }, [
          h("p", { class: "c-title", text: b.title }), h("p", null, [inlines(b.inl)])
        ]);
      case "list": return h("ul", { class: "list" }, b.items.map(function (it) { return h("li", null, [inlines(it)]); }));
      case "cards":
        return h("div", { class: "cards" }, b.cards.map(function (c) {
          return h("a", { class: "card", href: href(c.page) }, [
            h("span", { class: "card-title", text: c.title }), h("span", { class: "card-text", text: c.text }), h("span", { class: "card-meta", text: c.meta })
          ]);
        }));
      case "steps": return renderSteps(b, ctx);
    }
    return null;
  }

  function renderSteps(b, ctx) {
    var fig = mountFigure(b.diagram, {
      caption: [{ t: "text", v: "Each step frames one hop." }],
      steps: b.steps.map(function (s) { return s.edge; })
    });
    if (fig) ctx.figureIds.push(b.diagram);
    var active = -1, timer = null;
    var stepEls = [];
    var playBtn = h("button", { class: "btn primary", type: "button", text: "▶ Play" });
    var prevBtn = h("button", { class: "btn", type: "button", "aria-label": "Previous step", text: "← Prev" });
    var nextBtn = h("button", { class: "btn", type: "button", "aria-label": "Next step", text: "Next →" });
    var list = h("ol", { class: "walk-steps", role: "list", style: "list-style:none;margin:0;padding:0" });
    b.steps.forEach(function (s, i) {
      var el = h("li", { class: "step", tabindex: "0", "data-edge": s.edge, "aria-current": null }, [
        h("span", { class: "step-no", text: String(i + 1) }),
        h("div", null, [h("div", { class: "step-title" }, [inlines(s.title)]), h("div", { class: "step-body" }, [inlines(s.body)])])
      ]);
      el.addEventListener("click", function (e) { if (e.target.closest("a,button")) return; stop(); go(i); });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.target.closest("a,button")) { stop(); go(i); } });
      stepEls.push(el);
      list.appendChild(el);
    });
    function go(i) {
      active = (i + b.steps.length) % b.steps.length;
      stepEls.forEach(function (el, k) {
        el.classList.toggle("is-active", k === active);
        if (k === active) el.setAttribute("aria-current", "step"); else el.removeAttribute("aria-current");
      });
      if (fig) fig.highlightEdge(b.steps[active].edge);
      var r = stepEls[active].getBoundingClientRect();
      if (r.top < 70 || r.bottom > window.innerHeight) stepEls[active].scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }
    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      playBtn.textContent = "▶ Play";
    }
    playBtn.addEventListener("click", function () {
      if (timer) { stop(); return; }
      if (active < 0 || active >= b.steps.length - 1) go(0); else go(active + 1);
      if (reduceMotion) return;
      playBtn.textContent = "❚❚ Pause";
      timer = setInterval(function () {
        if (active >= b.steps.length - 1) { stop(); return; }
        go(active + 1);
      }, 1600);
    });
    prevBtn.addEventListener("click", function () { stop(); go(active <= 0 ? 0 : active - 1); });
    nextBtn.addEventListener("click", function () { stop(); go(active < 0 ? 0 : Math.min(b.steps.length - 1, active + 1)); });
    ctx.cleanups.push(stop);
    return h("div", { class: "walk" }, [
      h("div", null, [h("div", { class: "walk-controls" }, [playBtn, prevBtn, nextBtn]), list]),
      h("div", { class: "walk-figure" }, [fig ? fig.panel : null])
    ]);
  }

  // ── Routing & page render ────────────────────────────────────────────────
  var current = { page: null, cleanups: [], observer: null };

  function parseHash() {
    var raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = raw.split("#");
    var page = parts[0] || "overview";
    if (!pagesById[page]) page = "overview";
    return { page: page, anchor: parts[1] || null };
  }

  function renderPage(route) {
    current.cleanups.forEach(function (f) { f(); });
    if (current.observer) current.observer.disconnect();
    closePopover();
    figures.forEach(function (f) { if (f.isFullscreen()) f.setFullscreen(false); });
    figures = [];
    var page = pagesById[route.page];
    var ctx = { page: page, toc: [], figureIds: [], cleanups: [] };
    var article = h("article", { class: "article" });
    article.appendChild(h("p", { class: "eyebrow", text: page.section }));
    article.appendChild(h("h1", { tabindex: "-1", text: page.title }));
    if (page.summary && page.summary.length) article.appendChild(h("p", { class: "lead" }, [inlines(page.summary)]));
    page.blocks.forEach(function (b) {
      var el = renderBlock(b, ctx);
      if (el) article.appendChild(el);
    });
    var idx = order.indexOf(page.id);
    var prev = idx > 0 ? pagesById[order[idx - 1]] : null;
    var next = idx >= 0 && idx < order.length - 1 ? pagesById[order[idx + 1]] : null;
    article.appendChild(h("nav", { class: "pager", "aria-label": "Pages" }, [
      prev ? h("a", { class: "prev", href: href(prev.id), rel: "prev" }, [h("span", { class: "p-dir", text: "← Previous" }), h("span", { class: "p-title", text: prev.title })]) : null,
      next ? h("a", { class: "next", href: href(next.id), rel: "next" }, [h("span", { class: "p-dir", text: "Next →" }), h("span", { class: "p-title", text: next.title })]) : null
    ]));
    main.replaceChildren(article);
    figures.forEach(function (f) { f.layout(); });
    renderRail(page, ctx);
    Object.keys(navLinks).forEach(function (k) {
      if (k === page.id) navLinks[k].setAttribute("aria-current", "page"); else navLinks[k].removeAttribute("aria-current");
    });
    document.title = page.title + (page.id === "overview" ? " — architecture" : " — " + m.name);
    current = { page: page.id, cleanups: ctx.cleanups, observer: current.observer };
    setNav(false);
    if (route.anchor) {
      var target = document.getElementById(route.anchor);
      if (target) { target.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }

  function renderRail(page, ctx) {
    rail.textContent = "";
    var tocLinks = [];
    if (ctx.toc.length) {
      rail.appendChild(h("h2", { text: "On this page" }));
      var ul = h("ul", { class: "toc" });
      ctx.toc.forEach(function (t) {
        var a = h("a", { href: href(page.id, t.id), "data-target": t.id, text: t.text, style: t.level > 2 ? "padding-left:22px" : null });
        tocLinks.push(a);
        ul.appendChild(h("li", null, [a]));
      });
      rail.appendChild(ul);
    }
    var dl = h("dl");
    function row(k, v) { if (v) { dl.appendChild(h("dt", { text: k })); dl.appendChild(h("dd", { text: v })); } }
    row("Repository", m.repo);
    row("Commit", m.commit ? short(m.commit) : "working tree");
    row("Branch", m.branch);
    row("Date", m.commitDate ? m.commitDate.slice(0, 10) : null);
    row("Evidence", ev.verified + "/" + ev.total + " verified");
    var links = h("div", { class: "links" }, [
      h("a", { href: page.mdPath, title: "This page as Markdown", text: ".md" }),
      h("a", { href: "README.md", title: "Markdown index", text: "README" }),
      h("a", { href: "llms.txt", title: "For LLMs", text: "llms.txt" })
    ]);
    ctx.figureIds.filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (fid) {
      var d = book.diagrams[fid];
      links.appendChild(h("a", { href: d.irPath, title: d.title + " (DiagramIR)", text: fid + ".ir.json" }));
    });
    rail.appendChild(h("div", { class: "meta-card" }, [dl, links, h("p", { style: "margin:10px 0 0;color:var(--ad-muted);font-size:11.5px", text: m.generator })]));

    if (current.observer) current.observer.disconnect();
    if (!tocLinks.length || !("IntersectionObserver" in window)) return;
    var visible = {};
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting ? e.boundingClientRect.top : undefined; });
      var best = null;
      ctx.toc.forEach(function (t) { if (visible[t.id] !== undefined && best === null) best = t.id; });
      if (best === null) {
        // Nothing in view: the last heading above the viewport is current.
        ctx.toc.forEach(function (t) { var el = document.getElementById(t.id); if (el && el.getBoundingClientRect().top < 90) best = t.id; });
      }
      tocLinks.forEach(function (a) { a.classList.toggle("is-active", a.getAttribute("data-target") === best); });
    }, { rootMargin: "-64px 0px -55% 0px" });
    ctx.toc.forEach(function (t) { var el = document.getElementById(t.id); if (el) observer.observe(el); });
    current.observer = observer;
  }

  // ── Search ───────────────────────────────────────────────────────────────
  function plain(list) {
    return (list || []).map(function (i) {
      if (i.t === "cite") { var c = book.cites[i.id]; return c ? " " + c.file : ""; }
      return i.v || "";
    }).join("");
  }
  var index = [];
  book.pages.forEach(function (p) {
    var heading = null;
    index.push({ page: p.id, anchor: null, title: p.title, where: p.section, text: (p.title + " " + plain(p.summary)).toLowerCase(), weight: 3 });
    p.blocks.forEach(function (b) {
      if (b.t === "heading") {
        heading = b;
        index.push({ page: p.id, anchor: b.id, title: b.text, where: p.title, text: b.text.toLowerCase(), weight: 2 });
        return;
      }
      var bits = [];
      if (b.t === "para" || b.t === "callout") bits.push(plain(b.inl) + (b.title ? " " + b.title : ""));
      if (b.t === "table") b.rows.forEach(function (r) { bits.push(r.map(plain).join(" ")); });
      if (b.t === "list") b.items.forEach(function (it) { bits.push(plain(it)); });
      if (b.t === "steps") b.steps.forEach(function (s) { bits.push(plain(s.title)); });
      bits.forEach(function (text) {
        index.push({ page: p.id, anchor: heading ? heading.id : null, title: heading ? heading.text : p.title, where: p.title, snippet: text, text: text.toLowerCase(), weight: 1 });
      });
    });
  });
  var sel = -1, hits = [];
  function search(q) {
    q = q.trim().toLowerCase();
    results.textContent = "";
    sel = -1;
    if (!q) { results.hidden = true; return; }
    var terms = q.split(/\s+/);
    var scored = [];
    index.forEach(function (e) {
      if (!terms.every(function (t) { return e.text.indexOf(t) >= 0; })) return;
      var score = e.weight * 10 + (e.title.toLowerCase().indexOf(q) === 0 ? 20 : 0) + (e.title.toLowerCase() === q ? 30 : 0);
      scored.push({ e: e, score: score });
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    var seen = {};
    hits = [];
    scored.forEach(function (s) {
      var key = s.e.page + "#" + (s.e.anchor || "");
      if (seen[key] || hits.length >= 8) return;
      seen[key] = true;
      hits.push(s.e);
    });
    if (!hits.length) {
      results.appendChild(h("div", { class: "empty", text: "No matches" }));
    } else {
      hits.forEach(function (e, i) {
        var where = e.anchor ? pagesById[e.page].title : pagesById[e.page].section;
        var b = h("button", { class: "result", type: "button", role: "option", id: "sr-" + i, "aria-selected": "false" }, [
          h("span", { class: "r-title", text: e.title }),
          h("span", { class: "r-where", text: where + (e.snippet ? " · " + e.snippet.slice(0, 90) : "") })
        ]);
        b.addEventListener("mousedown", function (ev) { ev.preventDefault(); choose(i); });
        results.appendChild(b);
      });
    }
    results.hidden = false;
  }
  function highlight(i) {
    var items = results.querySelectorAll(".result");
    if (!items.length) return;
    sel = (i + items.length) % items.length;
    items.forEach(function (el, k) { el.setAttribute("aria-selected", String(k === sel)); });
    searchInput.setAttribute("aria-activedescendant", "sr-" + sel);
    items[sel].scrollIntoView({ block: "nearest" });
  }
  function choose(i) {
    var e = hits[i];
    if (!e) return;
    results.hidden = true;
    searchInput.value = "";
    searchInput.blur();
    var target = href(e.page, e.anchor);
    if (location.hash === target) renderPage(parseHash()); else location.hash = target;
  }
  searchInput.addEventListener("input", function () { search(searchInput.value); });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); highlight(sel + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); highlight(sel - 1); }
    else if (e.key === "Enter") { e.preventDefault(); choose(sel < 0 ? 0 : sel); }
    else if (e.key === "Escape") { searchInput.value = ""; results.hidden = true; searchInput.blur(); }
  });
  searchInput.addEventListener("blur", function () { setTimeout(function () { results.hidden = true; }, 120); });
  searchInput.addEventListener("focus", function () { if (searchInput.value) search(searchInput.value); });

  // ── Global keys ──────────────────────────────────────────────────────────
  document.addEventListener("keydown", function (e) {
    var typing = e.target.closest && e.target.closest("input,textarea,[contenteditable]");
    if (e.key === "Escape") {
      var fs = figures.filter(function (f) { return f.isFullscreen(); })[0];
      if (!popover.hidden) {
        var a = popState.anchor;
        closePopover();
        if (a && a.focus) { suppressFocusOpen = true; a.focus(); suppressFocusOpen = false; }
        return;
      }
      if (fs) { fs.setFullscreen(false); return; }
      if (document.body.classList.contains("nav-open")) setNav(false);
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); searchInput.focus(); }
    else if (e.key === "t") toggleTheme();
  });

  window.addEventListener("hashchange", function () {
    var route = parseHash();
    if (route.page === current.page && route.anchor) {
      var el = document.getElementById(route.anchor);
      if (el) { el.scrollIntoView(); return; }
    }
    renderPage(route);
  });
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { figures.forEach(function (f) { f.layout(); }); }, 120);
  });
  window.addEventListener("resize", function () { if (!popover.hidden && popState.anchor) positionPopover(popState.anchor); });

  renderPage(parseHash());
  window.nunkiBook = { book: book, go: function (p) { location.hash = href(p); }, figures: function () { return figures; } };
})();
</script>
</body>
</html>
