services:
  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api-gateway:3000
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      PAYMENTS_URL: http://payments:8080
      DATABASE_URL: postgres://shop@db:5432/shop
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - redis
      - kafka
      - db
      - payments

  payments:
    build: ./payments
    environment:
      DATABASE_URL: postgres://shop@db:5432/shop
      STRIPE_API_KEY: ${STRIPE_API_KEY}
    depends_on:
      - db

  fulfillment:
    build: ./fulfillment
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://shop@db:5432/shop
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    depends_on:
      - kafka
      - db

  ledger-audit:
    build: ./ledger-audit
    environment:
      DATABASE_URL: postgres://shop@db:5432/shop
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop

  redis:
    image: redis:7

  kafka:
    image: redpandadata/redpanda:v24.1.1
