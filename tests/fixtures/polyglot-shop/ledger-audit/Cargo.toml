[package]
name = "ledger-audit"
version = "0.1.0"
edition = "2021"
description = "Read-only reconciliation reports over the payments ledger"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
