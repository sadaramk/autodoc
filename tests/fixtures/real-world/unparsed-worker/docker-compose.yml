services:
  vote:
    build: ./vote
    ports:
      - "8080:80"
    depends_on:
      - redis

  worker:
    build: ./worker
    depends_on:
      - redis
      - db

  result:
    build: ./result
    ports:
      - "5001:4567"
    depends_on:
      - db

  redis:
    image: redis:alpine

  db:
    image: postgres:15
