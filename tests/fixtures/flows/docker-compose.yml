services:
  orders-api:
    build: ./orders-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app@db/app
      KAFKA_BROKERS: kafka:9092
    depends_on: [db, kafka]
  billing-worker:
    build: ./billing-worker
    environment:
      DATABASE_URL: postgres://app@db/app
      KAFKA_BROKERS: kafka:9092
  inventory:
    build: ./inventory
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db/app
  metrics:
    build: ./metrics
  db:
    image: postgres:16
  kafka:
    image: confluentinc/cp-kafka:7.6.0
