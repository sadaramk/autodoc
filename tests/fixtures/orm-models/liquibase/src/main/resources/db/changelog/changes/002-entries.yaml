databaseChangeLog:
  - changeSet:
      id: 2
      author: acme
      changes:
        - createTable:
            tableName: ledger_entries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: ledger
                  type: BIGINT
              - column:
                  name: amount_cents
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: 3
      author: acme
      changes:
        - renameColumn:
            tableName: ledger_entries
            oldColumnName: ledger
            newColumnName: ledger_id
        - addForeignKeyConstraint:
            baseTableName: ledger_entries
            baseColumnNames: ledger_id
            referencedTableName: ledgers
            referencedColumnNames: id
            constraintName: fk_entries_ledger
