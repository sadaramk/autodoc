name: Examples site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p nunki-cli

      # Documenting itself is the honest demonstration: the book on the site is
      # produced by the same commit it describes. It runs before anything is
      # copied into site/, so the scan sees the repository and not the output.
      - name: nunki's own repository
        run: ./target/release/nunki generate . --out /tmp/nunki-self

      - name: The project's own demo repository
        run: |
          mkdir -p site/examples
          cp -R examples/polyglot-shop site/examples/polyglot-shop
          cp -R /tmp/nunki-self site/examples/nunki

      # Third-party examples: permissively licensed, generated fresh, attribution on the gallery page.
      - name: Spring PetClinic (Apache-2.0)
        run: |
          git clone --depth 1 https://github.com/spring-projects/spring-petclinic /tmp/spring-petclinic
          ./target/release/nunki generate /tmp/spring-petclinic --out site/examples/spring-petclinic

      - name: PiggyMetrics (MIT)
        run: |
          git clone --depth 1 https://github.com/sqshq/piggymetrics /tmp/piggymetrics
          ./target/release/nunki generate /tmp/piggymetrics --out site/examples/piggymetrics

      - name: Assemble the site
        run: |
          cp docs/*.html docs/style.css docs/robots.txt docs/sitemap.xml site/
          cp docs/favicon.svg docs/favicon-32.png docs/apple-touch-icon.png docs/og.png site/
          # The pages are copied to the site root, so images they reference have
          # to sit beside them rather than one directory up.
          cp -R media site/media
          touch site/.nojekyll
          du -sh site site/examples/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
