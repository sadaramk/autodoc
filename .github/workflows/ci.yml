name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rustfmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same toolchain as the Docker image, so lints agree everywhere.
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript:
    name: IR contract (zod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: packages/ir-spec-ts
      - run: npm test
        working-directory: packages/ir-spec-ts

  browser:
    name: Interactive pages (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo build --release -p nunki-cli
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Run journeys
        working-directory: tests/e2e
        env:
          NUNKI_BIN: ${{ github.workspace }}/target/release/nunki
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: tests/e2e/test-results/

  action:
    name: The published action runs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The diff comment below writes to the pull request.
      pull-requests: write
    steps:
      # `fetch-depth: 0` so the pull request's base commit is present: `diff`
      # checks out both revisions itself and cannot invent a commit it wasn't given.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Exercises the action as a consumer would: it downloads the binary from the
      # last release, so it proves the release assets, the checksum check and the
      # entrypoint — not this commit's build.
      #
      # `analyze` on purpose. The released binary is one version behind `main`, so
      # asking it for a subcommand added since would fail on the version rather
      # than on the action, which is not what this job is for.
      - uses: ./
        with:
          command: analyze
          args: --depth container
      # nunki comments on its own pull requests. The stubbed-`gh` tests in
      # `crates/cli/tests/action_comment.rs` pin the upsert logic; this proves the
      # part they cannot — that a real token, on a real event, reaches the real API.
      - if: github.event_name == 'pull_request'
        uses: ./
        with:
          command: diff
          comment: true

  example:
    name: Example book is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Through Docker, like `make demo`: the container sees the fixture at a fixed
      # path and without this repository's `.git`, so the committed book is
      # reproducible on any machine and doesn't move with our commits.
      - run: make demo-check
